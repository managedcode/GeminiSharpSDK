name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'

jobs:
  build-test:
    name: Build and Gemini CLI Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Gemini CLI
        shell: bash
        run: |
          set -euo pipefail
          target_version="$(sed -nE 's/^[[:space:]]*public const string TargetVersion = "([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' GeminiSharpSDK/Models/GeminiCliCompatibility.cs)"
          [[ -n "$target_version" && "$target_version" != *$'\n'* ]] || { echo "Expected exactly one three-part Gemini CLI TargetVersion."; exit 1; }
          npm install --no-save "@google/gemini-cli@$target_version"
          npm_root="$(npm root)"
          package_root="$(node -e 'process.stdout.write(require("node:path").resolve(process.argv[1], "@google", "gemini-cli"))' "$npm_root")"
          printf 'Gemini install working directory: %s\n' "$PWD"
          printf 'Gemini npm root: %s\n' "$npm_root"
          entry_path="$(node -e 'const fs=require("node:fs"),path=require("node:path"),root=path.resolve(process.argv[1]),manifestPath=path.join(root,"package.json"),manifest=JSON.parse(fs.readFileSync(manifestPath,"utf8")),entry=manifest.bin?.gemini;if(typeof entry!=="string")process.exit(2);const resolved=path.resolve(root,entry);if(!resolved.startsWith(root+path.sep)||!fs.existsSync(resolved))process.exit(3);process.stdout.write(resolved)' "$package_root")"
          node -e 'const fs=require("node:fs"),path=require("node:path"),root=path.resolve(process.argv[1]),manifest=JSON.parse(fs.readFileSync(path.join(root,"package.json"),"utf8")); console.log(JSON.stringify({packageRoot:root,version:manifest.version,bin:manifest.bin?.gemini,entryPath:process.argv[2],entryExists:fs.existsSync(process.argv[2])}));' "$package_root" "$entry_path"
          printf 'Gemini declared entry: %s\n' "$entry_path"
          version="$(node "$entry_path" --version)"
          printf '%s\n' "$version"
          actual_version="$(printf '%s\n' "$version" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sed -n '1p')"
          printf 'Installed Gemini CLI version: %s\n' "$actual_version"
          [[ "$actual_version" == "$target_version" ]]
          npm_bin="$(node -e 'process.stdout.write(require("node:path").resolve(process.argv[1], ".bin"))' "$npm_root")"
          echo "$npm_bin" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore ManagedCode.GeminiSharpSDK.slnx

      - name: Build
        run: dotnet build ManagedCode.GeminiSharpSDK.slnx -c Release -warnaserror --no-restore

      - name: Test (full solution)
        run: dotnet test --solution ManagedCode.GeminiSharpSDK.slnx -c Release --no-build -- --treenode-filter "/*/*/*/*[RequiresGeminiAuth!=true]"

      - name: Smoke tests (Gemini CLI discover + invoke)
        run: dotnet test --project GeminiSharpSDK.Tests/GeminiSharpSDK.Tests.csproj -c Release --no-build -- --treenode-filter "/*/*/*/GeminiCli_Smoke_*"
